# SKAZKA — server nginx (edge ortida: TLS'ni Caddy/Traefik/CDN terminate qiladi)
# Faqat HTTP; dinamik DNS resolver (konteyner IP o'zgarsa eskirgan IP'ni keshlamaslik uchun).
resolver 127.0.0.11 valid=10s ipv6=off;

# Edge X-Forwarded-Proto bersa — o'shani, bermasa joriy sxema
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location /api/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
    location /admin/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }
    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
}
