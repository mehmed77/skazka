# SKAZKA — production nginx (HTTPS, Let's Encrypt)
# Domeningizni almashtiring: skazka.example.uz
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

upstream frontend { server frontend:3000; }
upstream backend  { server backend:8000; }

# HTTP -> HTTPS
server {
    listen 80;
    server_name skazka.example.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name skazka.example.uz;

    ssl_certificate     /etc/letsencrypt/live/skazka.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skazka.example.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 50m;

    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
    }
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
    }
    location /admin/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
    }
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params;
    }
}
