# SKAZKA — dev nginx (HTTP, port 80 -> host 8080)
upstream frontend { server frontend:3000; }
upstream backend  { server backend:8000; }

server {
    listen 80;
    server_name _;

    # Bola uchun media (audio/rasm) yirik bo'lishi mumkin
    client_max_body_size 50m;

    # Django admin + API
    location /api/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
    }
    location /admin/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
    }

    # To'plangan static (Django)
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # Qolgan hammasi — Next.js (HMR websocket ham shu yerdan o'tadi)
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params;
    }
}
