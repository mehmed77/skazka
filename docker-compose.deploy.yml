# SKAZKA — server (production) stack
# Bu fayl serverda ishlaydi. Image'lar CI (GitHub Actions) tomonidan
# oldindan build qilinib GHCR'ga yuklanadi — serverda build QILINMAYDI.
#
# Ishga tushirish (server):
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
name: skazka

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/OWNER/skazka-backend:latest}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py init_storage &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "False"
    volumes:
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # Bir martalik "release" bosqichi — migratsiya + seed buyruqlari.
  # `up -d` bilan AVTOMATIK ko'tarilmaydi (profil ostida); CI uni alohida chaqiradi:
  #   docker compose -f docker-compose.deploy.yml run --rm release
  release:
    image: ${BACKEND_IMAGE:-ghcr.io/OWNER/skazka-backend:latest}
    command: sh release.sh
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - release
    restart: "no"

  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/OWNER/skazka-backend:latest}
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  beat:
    image: ${BACKEND_IMAGE:-ghcr.io/OWNER/skazka-backend:latest}
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/OWNER/skazka-frontend:latest}
    command: npm run start
    env_file: .env
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx/prod-http.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
    ports:
      # Host 80/443 edge (Caddy/Traefik/CDN) tomonidan band bo'lishi mumkin — SKAZKA 8090-portda.
      - "8090:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # Avtomatik kunlik zaxira — pg_dump, oxirgi 7 nusxa
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    env_file: .env
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        ts=$$(date +%F-%H%M);
        echo "[backup] $$ts boshlandi";
        pg_dump -h db -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > /backups/db-$$ts.sql.gz || echo "[backup] xato";
        ls -t /backups/*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f;
        echo "[backup] tugadi, 24 soat kutiladi";
        sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Barcha volume'lar external — `docker compose down -v` ham O'CHIRA OLMAYDI.
  # Server'da bir marta yaratilgan:
  #   docker volume create skazka_pgdata skazka_miniodata skazka_redisdata skazka_staticfiles
  pgdata:
    external: true
    name: skazka_pgdata
  miniodata:
    external: true
    name: skazka_miniodata
  redisdata:
    external: true
    name: skazka_redisdata
  staticfiles:
    external: true
    name: skazka_staticfiles
