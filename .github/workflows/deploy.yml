name: Deploy

# DIQQAT: avtomatik deploy O'CHIRILGAN (faqat qo'lda).
# Server provision qilinib, quyidagi GitHub secret'lar qo'shilgach
# (SSH_HOST, SSH_USER, SSH_KEY, SSH_PORT, DEPLOY_PATH, GHCR_TOKEN),
# avtomatik deploy uchun `push: { branches: [main] }` ni qaytaring.
# Hozircha: GitHub → Actions → Deploy → "Run workflow" orqali qo'lda ishga tushadi.
on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/skazka-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/skazka-frontend

jobs:
  # ── 1) Image'larni build qilib GHCR'ga yuklash ──────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tasvir nomlarini lowercase qilish va tag tayyorlash
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}
          echo "backend=ghcr.io/$OWNER/skazka-backend"   >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$OWNER/skazka-frontend" >> "$GITHUB_OUTPUT"
          echo "backend_tag=ghcr.io/$OWNER/skazka-backend:$SHA"   >> "$GITHUB_OUTPUT"
          echo "frontend_tag=ghcr.io/$OWNER/skazka-frontend:$SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR'ga login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image (build + push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./docker/backend.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend }}:latest
            ${{ steps.meta.outputs.backend_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

      - name: Frontend image (build + push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./docker/frontend.Dockerfile
          target: prod
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend }}:latest
            ${{ steps.meta.outputs.frontend_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend,ignore-error=true

  # ── 2) Serverga deploy (SSH) ────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Compose va nginx fayllarini serverga ko'chirish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.deploy.yml,nginx/prod-http.conf,nginx/proxy_params"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull va qayta ishga tushirish
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # Image pull (backend + frontend) sekin tarmoqda 10m dan oshishi mumkin — zaxira bilan.
          command_timeout: 25m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            export BACKEND_IMAGE="${{ needs.build.outputs.backend_tag }}"
            export FRONTEND_IMAGE="${{ needs.build.outputs.frontend_tag }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.deploy.yml pull
            # Migratsiya + seed: ilova konteynerlari ko'tarilishidan OLDIN, bir marta.
            # Xato bo'lsa (set -e) deploy shu yerda to'xtaydi — yarim deploy bo'lmaydi.
            docker compose -f docker-compose.deploy.yml run --rm release
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            # nginx config (mount) o'zgarsa qo'llanishi + upstream IP'larni yangilash uchun;
            # beat — yangi jadvalni DB'dan qayta o'qishi uchun.
            docker compose -f docker-compose.deploy.yml restart nginx beat
            docker image prune -f
            docker compose -f docker-compose.deploy.yml ps
