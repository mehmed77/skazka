# SKAZKA — development stack
# Ishga tushirish:  docker compose up -d --build
name: skazka

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # host 5433 (lokal Postgres 5432 bilan to'qnashmaslik uchun)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py init_storage &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    command: celery -A config worker -l info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis

  beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: dev
    command: npm run dev
    env_file: .env
    volumes:
      - ./frontend:/app
      # Nomli volume — konteyner qayta yaratilganda ham node_modules saqlanadi
      # (anonim volume har recreate'da yo'qolib, yangi npm depslarni o'chirardi).
      - frontend_node_modules:/app/node_modules
      - /app/.next
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
    ports:
      - "8080:80"   # host 8080 (lokal 80-port bilan to'qnashmaslik uchun)
    depends_on:
      - frontend
      - backend

  # Avtomatik kunlik zaxira — pg_dump, oxirgi 7 nusxa saqlanadi
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    env_file: .env
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        ts=$$(date +%F-%H%M);
        echo "[backup] $$ts boshlandi";
        pg_dump -h db -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > /backups/db-$$ts.sql.gz || echo "[backup] xato";
        ls -t /backups/*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f;
        echo "[backup] tugadi, 24 soat kutiladi";
        sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  staticfiles:
  frontend_node_modules:
